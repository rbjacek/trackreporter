<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540" role="img" aria-labelledby="title desc">
<title id="title">Work Order lifecycle with linked GPS route</title>
<desc id="desc">Illustration of a Work Order moving from Assigned to In Progress to Completed, with GPS route evidence attached to the job.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123d55"/><stop offset="1" stop-color="#0a1e33"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173d56"/><stop offset="1" stop-color="#102c44"/></linearGradient>
 <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6be2ed"/><stop offset="1" stop-color="#8baaff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-40%" width="170%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect width="780" height="540" rx="28" fill="url(#bg)"/>
<circle cx="678" cy="62" r="120" fill="#2b8194" opacity=".12"/>
<circle cx="95" cy="420" r="160" fill="#247b9b" opacity=".12"/>
<text x="42" y="53" font-family="Arial,sans-serif" font-size="16" fill="#91b8cc" letter-spacing="2">FIELD WORK OPERATIONS</text>
<text x="42" y="90" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#f1faff">Work Order #1042</text>
<rect x="42" y="114" width="696" height="156" rx="19" fill="url(#card)" stroke="#366078" filter="url(#shadow)"/>
<text x="64" y="145" font-family="Arial,sans-serif" font-size="15" fill="#b3cddd">Inspection visit</text>
<text x="64" y="171" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#f2faff">Field assignment</text>
<g font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
 <rect x="64" y="197" width="150" height="42" rx="12" fill="#244e69" stroke="#6bb3da"/><text x="139" y="223" fill="#cceaff">ASSIGNED</text>
 <path d="M228 218h28" stroke="#9ac9dc" stroke-width="3" stroke-linecap="round"/><path d="M249 211l9 7-9 7" stroke="#9ac9dc" stroke-width="3" fill="none"/>
 <rect x="272" y="197" width="162" height="42" rx="12" fill="#1d5480" stroke="#73baff"/><text x="353" y="223" fill="#e6f4ff">IN PROGRESS</text>
 <path d="M448 218h28" stroke="#9ac9dc" stroke-width="3" stroke-linecap="round"/><path d="M469 211l9 7-9 7" stroke="#9ac9dc" stroke-width="3" fill="none"/>
 <rect x="492" y="197" width="214" height="42" rx="12" fill="#1c5d4b" stroke="#71d6a1"/><text x="599" y="223" fill="#d4ffe7">COMPLETED</text>
</g>
<rect x="42" y="294" width="696" height="205" rx="19" fill="#0c2b43" stroke="#315b75" filter="url(#shadow)"/>
<text x="64" y="330" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#e7f8ff">Linked GPS route evidence</text>
<text x="64" y="354" font-family="Arial,sans-serif" font-size="13" fill="#a3c5d6">Recorded route associated with the Work Order</text>
<g opacity=".32" stroke="#6597ad" stroke-width="1.5">
<path d="M70 387H710M70 422H710M70 457H710"/><path d="M135 370V482M228 370V482M321 370V482M414 370V482M507 370V482M600 370V482M693 370V482"/>
</g>
<path d="M94 461L166 444L230 451L296 396L374 420L448 387L529 407L603 377L688 394" fill="none" stroke="#0b2335" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M94 461L166 444L230 451L296 396L374 420L448 387L529 407L603 377L688 394" fill="none" stroke="url(#route)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="94" cy="461" r="9" fill="#76e6f2" stroke="#e7ffff" stroke-width="3"/>
<circle cx="688" cy="394" r="10" fill="#7ad9a5" stroke="#e8fff3" stroke-width="3"/>
<g transform="translate(537,438)"><rect width="172" height="35" rx="10" fill="#184960" stroke="#518a9e"/><text x="86" y="23" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d8f7ff">GPS ROUTE ATTACHED</text></g>
</svg>
